<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부모님 자서전 인생 기록 작가</title>
  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }
    body { margin: 0; background-color: #b2c7da; display: flex; flex-direction: column; height: 100vh; }
    
    .header { background: #343b41; color: white; padding: 16px; text-align: center; font-weight: bold; font-size: 18px; }
    
    .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 16px; line-height: 1.5; word-break: break-word; }
    .bot { background: white; align-self: flex-start; border-top-left-radius: 2px; color: #333; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .user { background: #ffeb33; align-self: flex-end; border-top-right-radius: 2px; color: #000; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    
    .input-area { display: flex; padding: 12px; background: white; gap: 8px; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 14px; border: 1px solid #ccc; border-radius: 24px; outline: none; font-size: 16px; }
    button { padding: 0 20px; background: #ffeb33; border: none; border-radius: 24px; font-weight: bold; font-size: 15px; cursor: pointer; }
    button:disabled { background: #eee; color: #999; }
  </style>
</head>
<body>

  <div class="header">📖 부모님 자서전 인생 기록 작가</div>
  
  <div class="chat-container" id="chat">
    <div class="message bot">안녕하세요 어머님, 아버님! 오늘 하루는 어떻게 보내셨나요? 소중한 추억을 들려주시면 예쁜 책으로 기록해 드릴게요.</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="이야기를 편하게 말씀해 주세요..." onkeypress="if(event.keyCode==13) sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">전송</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = "";
      
      const btn = document.getElementById("sendBtn");
      btn.disabled = true;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        
        const data = await response.json();
        appendMessage(data.reply, 'bot');
      } catch (err) {
        appendMessage("잠시 통신이 원활하지 않아요. 다시 한 번 말씀해 주세요!", 'bot');
      } finally {
        btn.disabled = false;
      }
    }

    function appendMessage(text, side) {
      const chat = document.getElementById("chat");
      const msg = document.createElement("div");
      msg.className = "message " + side;
      msg.innerText = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
