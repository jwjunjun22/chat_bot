<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오톡 챗봇 서버</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .status-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #111111;
        }
        p {
            font-size: 14px;
            color: #6e6e73;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-icon">🟢</div>
        <h1>서버 정상 작동 중</h1>
        <p>카카오톡 자서전 챗봇 백엔드 서비스가 정상적으로 연결되어 가동 중입니다.</p>
        <span class="badge">Vercel Deployment Active</span>
    </div>

    <script>
      // API 키는 Vercel 환경변수(Environment Variables)로 관리됩니다.
      console.log("서버가 정상 구동 중입니다.");
    </script>
</body>
</html>
